[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eudi-pid"
version = "0.1.0"
description = "Request and verify a German EUDI PID (mdoc) over OpenID4VP 1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "jwcrypto>=1.5",
    "cbor2>=5.6",
]

[project.optional-dependencies]
qr = ["qrcode>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eudi_pid = ["py.typed", "data/*.pem"]
